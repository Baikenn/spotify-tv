<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify TV</title>
<style>
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #000; overflow: hidden; font-family: sans-serif; color: #fff;
    }
    #status {
        position: absolute; top: 16px; left: 16px;
        font-size: 13px; opacity: 0.5;
    }
    #now-playing {
        position: absolute; bottom: 24px; left: 24px;
        display: none; align-items: center; gap: 16px;
    }
    #now-playing img { width: 72px; height: 72px; border-radius: 6px; }
    #np-title { font-weight: bold; font-size: 22px; }
    #np-artist { opacity: 0.7; font-size: 16px; }
</style>
</head>
<body>
<div id="status">Connecting…</div>
<div id="now-playing">
    <img id="np-art" src="" alt="">
    <div>
        <div id="np-title"></div>
        <div id="np-artist"></div>
    </div>
</div>
<audio id="player" autoplay></audio>

<script>
/* ===================== CONFIG ===================== */
const STREAM_URL = 'http://127.0.0.1:8000/stream.ogg'; // from start-stream.bat
const CLIENT_ID = '99d8990168db45078cf98359b504f922';
const REFRESH_TOKEN = 'AQDVBNRVvGafz_3J2ybu58JemwMNA13C5qn7Ua1-EYZOp1sbX4emBHI-V2XHEbbzH0thK6no3Eew32I5Sq0xQB1T7iquku-8vIsjZMepdAp0XnqH2XWCN6Y0mvZH4UlCE5g';             // from the one-time auth.html step
/* ==================================================== */

const audio = document.getElementById('player');
const statusEl = document.getElementById('status');

function connectStream() {
    statusEl.textContent = 'Connecting to stream…';
    audio.src = STREAM_URL + '?t=' + Date.now(); // cache-bust each attempt
    audio.play().then(() => {
        statusEl.textContent = '';
    }).catch(() => {
        statusEl.textContent = 'Waiting for stream…';
        setTimeout(connectStream, 3000);
    });
}
audio.addEventListener('error', () => {
    statusEl.textContent = 'Stream dropped, reconnecting…';
    setTimeout(connectStream, 3000);
});
audio.addEventListener('ended', () => setTimeout(connectStream, 1000));
connectStream();

// Live streams have no fixed length — if the browser buffers ahead faster
// than it plays (common on a fast localhost link), the gap between what's
// downloaded and what's actually playing grows over time. This trims it
// back down periodically so playback doesn't drift further from real-time.
setInterval(() => {
    if (audio.buffered.length) {
        const bufferedEnd = audio.buffered.end(audio.buffered.length - 1);
        const lag = bufferedEnd - audio.currentTime;
        if (lag > 1.5) audio.currentTime = bufferedEnd - 0.3;
    }
}, 2000);

// ---- Now-playing display only (plain Web API calls, no DRM involved) ----
let accessToken = null, tokenFetchedAt = 0;
async function getAccessToken() {
    if (accessToken && Date.now() - tokenFetchedAt < 50 * 60 * 1000) return accessToken;
    const body = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: 'refresh_token',
        refresh_token: REFRESH_TOKEN
    });
    const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error_description || data.error);
    accessToken = data.access_token;
    tokenFetchedAt = Date.now();
    return accessToken;
}

async function updateNowPlaying() {
    try {
        const token = await getAccessToken();
        const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const npEl = document.getElementById('now-playing');
        if (res.status === 200) {
            const data = await res.json();
            if (data && data.item) {
                document.getElementById('np-title').textContent = data.item.name;
                document.getElementById('np-artist').textContent =
                    data.item.artists.map(a => a.name).join(', ');
                const art = data.item.album && data.item.album.images && data.item.album.images[0];
                document.getElementById('np-art').src = art ? art.url : '';
                npEl.style.display = 'flex';
                return;
            }
        }
        npEl.style.display = 'none';
    } catch (e) {
        console.error('now-playing error', e);
    }
}
updateNowPlaying();
setInterval(updateNowPlaying, 8000);
</script>
</body>
</html>
